<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8"/>

    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" href="leaflet.css"/>

    <script src="leaflet.js"></script>

    <style>

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    var map = L.map('map').setView([50.0010, 36.2360], 12);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }
    ).addTo(map);

    L.marker([50.0010, 36.2360])
        .addTo(map)
        .bindPopup("DroneTracker")
        .openPopup();

</script>

</body>

</html>
